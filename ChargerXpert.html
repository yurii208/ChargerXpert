<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ChargerXpert</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype bar on top, then one of five shells (LINE phone stage, public site, customer app, admin sidebar app, QR passport). Yellow is the signature, black carries structure. */
:root{
  --y:#FFC928; --y-wash:#FFF6D6; --y-ink:#6B4F00;
  --ink:#171717; --paper:#FFFFFF; --mist:#F4F4F2; --mute:#777777; --rule:#E3E3DD; --field:#D2D2CB;
  --ok:#269B62; --ok-wash:#E3F4EB; --ok-ink:#17653F;
  --warn:#F29D38; --warn-wash:#FDEFDC; --warn-ink:#84500A;
  --bad:#D94A4A; --bad-wash:#FBE5E5; --bad-ink:#9B2B2B;
  --fd:'Prompt','IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --fb:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(23,23,23,.06),0 10px 24px -14px rgba(23,23,23,.2);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
h1,h2,h3,h4{font-family:var(--fd);margin:0;font-weight:600;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mu{color:var(--mute)} .mono{font-family:var(--fm);font-size:.92em} .tn{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.g2,.g3,.g4{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g2>*,.g3>*,.g4>*{min-width:0}

/* prototype bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:#fff}
.pbar .wrap{display:flex;gap:8px 12px;align-items:center;padding-block:8px;flex-wrap:wrap}
.pbar .tag{font:600 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--y)}
.pnav{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;order:5;min-width:0}
.pnav button{background:transparent;border:0;color:#d4d4cc;padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.pnav button.on{background:var(--y);color:var(--ink);font-weight:600}
.pbar select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.pbar .ghost{background:#2a2a2a;border:1px solid #444;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
@media(min-width:900px){.pnav{flex:1 1 auto;order:0}}

/* buttons, pills, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;min-height:42px}
.btn.y{background:var(--y);border-color:var(--y);color:var(--ink)} .btn.y:hover{background:#ffd351}
.btn.k{background:var(--ink);color:#fff} .btn.k:hover{background:#333}
.btn.o:hover{background:var(--mist)} .btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%} .btn.ghostb{border-color:var(--rule);font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--mist);color:#4d4d4d;white-space:nowrap}
.pill.y{background:var(--y-wash);color:var(--y-ink)} .pill.ok{background:var(--ok-wash);color:var(--ok-ink)}
.pill.w,.pill.warn{background:var(--warn-wash);color:var(--warn-ink)} .pill.bad{background:var(--bad-wash);color:var(--bad-ink)}
.pill.k{background:var(--ink);color:#fff} .pill.n,.pill.neutral{background:var(--mist);color:#4d4d4d}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#3a3a3a}
.in{width:100%;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:#fff;color:var(--ink);font:inherit;min-height:42px}
textarea.in{min-height:84px;resize:vertical}
.unit{position:relative}.unit .in{padding-right:56px}.unit i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-size:13px;pointer-events:none}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:20px;box-shadow:var(--sh);min-width:0}
.card.flat{box-shadow:none} .card.mist{background:var(--mist);box-shadow:none;border-color:transparent}
.card h3{font-size:17px;margin-bottom:12px}
.note{font-size:13px;color:var(--mute)}
.box{border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--y-wash);color:#4d3b00;display:flex;gap:10px;align-items:flex-start}
.box.bad{background:var(--bad-wash);color:var(--bad-ink)} .box.ok{background:var(--ok-wash);color:var(--ok-ink)} .box.mist{background:var(--mist);color:#444}
.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 11.5px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr[data-go]{cursor:pointer}.tbl tr[data-go]:hover td{background:var(--y-wash)}
.stat{padding:16px 18px;border-radius:14px;background:#fff;border:1px solid var(--rule)}
.stat b{display:block;font:600 30px/1.1 var(--fd);font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--mist);overflow:hidden}.bar>i{display:block;height:100%;background:var(--y);border-radius:99px}
.hb{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:13.5px;margin:10px 0}
.hb-t{height:18px;background:var(--mist);border-radius:6px;overflow:hidden}.hb-f{height:100%;background:var(--ink)}.hb-f.y{background:var(--y)}.hb-f.g{background:#9a9a92}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.stp{display:flex;gap:6px;list-style:none;margin:0;padding:0;overflow-x:auto}
.stp li{flex:1 0 96px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);border-top:3px solid var(--rule);padding-top:8px}
.stp li i{width:22px;height:22px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font:600 11px var(--fd);font-style:normal;color:#555}
.stp li.done{border-color:var(--ink);color:var(--ink)}.stp li.done i{background:var(--ink);color:#fff}
.stp li.cur{border-color:var(--y);color:var(--ink);font-weight:600}.stp li.cur i{background:var(--y);color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--rule);background:#fff;padding:8px 16px;border-radius:999px;font-weight:500}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px}.chips button.on{background:var(--y);border-color:var(--y);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--field);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg label{cursor:pointer}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 12px;font-size:13px;background:#fff;border-right:1px solid var(--field);min-width:56px;text-align:center}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--ink);color:#fff}
.seg input[value=obs]:checked+span{background:var(--warn);color:var(--ink)}.seg input[value=fail]:checked+span{background:var(--bad);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 18px var(--fd)}
.logo-m{width:32px;height:32px;border-radius:9px;background:var(--y);color:var(--ink);display:grid;place-items:center}

/* public site */
.pub-h{background:#fff;border-bottom:1px solid var(--rule)}
.pub-h .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.pub-h nav{display:flex;gap:2px;flex:1;overflow-x:auto;min-width:0}
.pub-h nav button{background:none;border:0;padding:8px 12px;border-radius:8px;white-space:nowrap}
.pub-h nav button:hover{background:var(--mist)}
.hero{background:var(--ink);color:#fff;padding-block:56px 64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,62px);letter-spacing:-.01em}.hero h1 em{font-style:normal;color:var(--y)}
.hero p.sub{font-size:18px;color:#d4d4cc;margin:18px 0 28px;max-width:34em}
.pp{background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.pp-h{background:var(--y);padding:12px 18px;font:600 13px var(--fd);display:flex;justify-content:space-between}
.pp-b{padding:18px;display:grid;grid-template-columns:1fr 112px;gap:16px;align-items:center}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:36px 44px}}
.sec{padding-block:64px}.sec.mist{background:var(--mist)}
.sec h2{font-size:clamp(26px,3.4vw,38px);margin-bottom:10px}
.svc{display:flex;flex-direction:column;gap:10px}.svc .ico{width:44px;height:44px;border-radius:12px;background:var(--y);display:grid;place-items:center}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:16px;list-style:none;padding:0;margin:28px 0 0;counter-reset:s}
.how li{counter-increment:s;border-top:3px solid var(--ink);padding-top:12px;font-weight:500}
.how li::before{content:counter(s);display:block;font:700 28px var(--fd);color:var(--y);-webkit-text-stroke:1px var(--ink);margin-bottom:4px}
.pk{border:1px solid var(--rule);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;background:#fff;min-width:0}
.pk.feat{background:var(--ink);color:#fff;border-color:var(--ink)}.pk.feat .mu,.pk.feat .note{color:#bdbdb4}
.pk-price b{font:700 30px var(--fd);font-variant-numeric:tabular-nums}.pk-price small{display:block;color:var(--mute)}
.pk ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px;flex:1}
.pk li{display:flex;gap:8px}.pk li svg{margin-top:3px;color:var(--ok)}.pk.feat li svg{color:var(--y)}
.foot{background:var(--ink);color:#bdbdb4;padding-block:28px;font-size:13px}

/* customer + admin shells */
.cnav{background:#fff;border-bottom:1px solid var(--rule)}
.cnav .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.cnav nav{display:flex;gap:4px;overflow-x:auto;flex:1 1 320px;min-width:0}
.cnav nav button,.side button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.cnav nav button.on{background:var(--y)} .cnav nav button:hover:not(.on){background:var(--mist)}
.page{padding-block:28px 64px;background:var(--mist);min-height:70vh}
.ph{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}.ph h1{font-size:clamp(24px,3vw,32px)}
.adm{display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--mist);min-height:75vh}
.side{background:var(--ink);color:#fff;padding:18px 12px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.side button{color:#d4d4cc;width:100%}.side button.on{background:var(--y);color:var(--ink);font-weight:600}.side button:hover:not(.on){background:#2b2b2b}
.side .logo{color:#fff;padding:4px 8px 14px}.side small{padding:10px 14px 4px;color:#8f8f88;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.adm-main{padding:24px 24px 64px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
@media(max-width:900px){.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:8px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}.side small,.side .logo{display:none}.adm-main{padding-left:max(16px,env(safe-area-inset-left,0px))}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.sticky{position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
@media(max-width:1000px){.sticky{position:static}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal b{font:600 12px var(--fd);color:var(--mute);text-align:center;padding:4px}
.cal div.d{min-height:72px;border:1px solid var(--rule);border-radius:8px;padding:4px 6px;font-size:12px;background:#fff;overflow:hidden}
.cal div.d.td{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.cal div.d.o{background:transparent;border-color:transparent}
.cal .jc{display:block;margin-top:3px;background:var(--y);border-radius:4px;padding:0 4px;font:500 10.5px var(--fm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .jc.dn{background:var(--ink);color:#fff}

/* inspection form + close job */
.item{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;padding:10px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.item:last-child{border:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photos figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.photos img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.photos button{position:absolute;top:6px;right:6px;border:0;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 4px;border-bottom:1px solid var(--rule);color:var(--mute);align-items:start}
.steps li i{width:26px;height:26px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font:600 12px var(--fd);font-style:normal}
.steps li.run{color:var(--ink);font-weight:600}.steps li.run i{background:var(--y)}
.steps li.ok{color:var(--ink)}.steps li.ok i{background:var(--ok);color:#fff}.steps li.bad{color:var(--bad-ink)}.steps li.bad i{background:var(--bad);color:#fff}
.steps small{display:block;font-weight:400;color:var(--mute)}

/* certificate + pdf */
.cert{background:#fff;border:1px solid var(--rule);border-radius:6px;box-shadow:var(--sh);max-width:860px;margin-inline:auto;overflow:hidden}
.cert-top{background:var(--ink);color:#fff;padding:22px 28px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.cert-top .logo{color:#fff}.cert-top h2{font-size:22px;color:var(--y)}
.cert-stripe{height:6px;background:var(--y)}
.cert-body{padding:28px;display:flex;flex-direction:column;gap:22px}
.qrb{width:132px;height:132px;padding:8px;border:1px solid var(--rule);border-radius:10px;background:#fff}.qrb svg{display:block;width:100%;height:100%}
.paper{background:#fff;border:1px solid var(--rule);max-width:820px;margin:0 auto 20px;box-shadow:var(--sh);padding:36px;min-height:520px;display:flex;flex-direction:column;gap:18px;font-size:13.5px}
.paper .ph2{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--y);padding-bottom:10px;gap:12px;flex-wrap:wrap}
.paper .pf{margin-top:auto;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);border-top:1px solid var(--rule);padding-top:8px}
.paper h4{font-size:15px;border-left:0;margin-bottom:6px}

/* LINE stage */
.stage{background:var(--mist);padding-block:28px 48px}
.stage .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start}
@media(max-width:900px){.stage .wrap{grid-template-columns:1fr;justify-items:center}}
.phone{width:100%;max-width:380px;height:min(780px,calc(100vh - 110px));min-height:600px;background:#fff;border-radius:34px;border:8px solid var(--ink);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.ph-h{background:var(--ink);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}.ph-h b{font:600 15px var(--fd)}
.chat{flex:1;overflow-y:auto;background:#EDEDE8;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;background:#fff;font-size:14px;align-self:flex-start}.bub.me{align-self:flex-end;background:var(--y)}
.tm{font-size:11px;color:var(--mute);margin-top:2px}
.lc{background:#fff;border-radius:16px;overflow:hidden;max-width:92%;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lc-h{background:var(--ink);color:var(--y);padding:10px 14px;font:600 14px var(--fd);display:flex;gap:8px;align-items:center}
.lc-b{padding:14px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.lc-f{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.lc-f button{border:0;background:#fff;padding:11px;font-weight:600;font-size:13.5px;border-top:1px solid var(--rule)}.lc-f button:first-child{border-top:0;background:var(--y)}
.rich{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.rich button{border:0;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12.5px/1.3 var(--fd);min-height:92px}
.rich small{font:400 10px var(--fb);opacity:.75}
.rich .a{background:var(--y);color:var(--ink)}.rich .b{background:var(--ink);color:#fff}.rich .c{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 .5px var(--rule)}
.rich .b svg{color:var(--y)}

/* modal + toast */
.ovl{position:fixed;inset:0;background:rgba(23,23,23,.55);z-index:80;display:grid;place-items:center;padding:16px}
.mdl{background:#fff;border-radius:18px;width:min(100%,520px);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px #000}
.mdl.wide{width:min(100%,760px)}
.mdl-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:#fff;z-index:1}
.mdl-h .x{border:0;background:var(--mist);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.mdl-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px -10px #000;border-left:5px solid var(--y)}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
.passc{max-width:460px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--rule)}
.passc .top{background:var(--ink);color:#fff;padding:18px 22px}.passc .top h2{color:var(--y);font-size:19px;margin-top:8px}

function fakeQr(t){
  let h=2166136261;for(const c of t){h=Math.imul(h^c.charCodeAt(0),16777619)>>>0}
  const n=25,rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h};
  let o='<svg viewBox="0 0 '+n+' '+n+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="'+n+'" height="'+n+'" fill="#fff"/>';
  const fin=(x,y)=>x<8&&y<8||x>n-9&&y<8||x<8&&y>n-9;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fin(x,y)&&rnd()%2)o+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#171717"/>';
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{o+='<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#171717"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#171717"/>'});
  return o+'</svg>';
}
function qrSvg(text){
  try{if(window.qrcode){const q=window.qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(4,0).replace(/^(<svg[^>]*?) width="[^"]*" height="[^"]*"/,'$1 width="100%" height="100%"')}}catch(e){}
  return fakeQr(text);
}

/* ===== ROI ===== */
function roiCalc(r){
  const pk=pkgOf(r.pkg),member=pk.price;
  const annual=r.heads*r.sess*r.kwhPer*r.price*r.days,monthly=annual/12;
  const lossAll=annual*r.dev/100*r.months/12,share=r.role==='host'?r.share/100:1,risk=lossAll*share,kept=risk*r.rec/100;
  const perVisit=r.visitPrice,diff=risk-perVisit,net=kept-member;
  const basis=annual*r.months/12;
  return {pk,monthly,annual,lossAll,risk,impact:kept,kept,member,perVisit,diff,net,roi:member?net/member*100:0,
    breakEven:basis?perVisit/basis*100:0,avgMember:pk.inspections?member/pk.inspections:0,over:r.heads>pk.covers};
}
const roiPct=n=>(n>=0?'':'−')+num(Math.abs(n),1)+'%';

    ()=>{db.records.push(rec);return {t:'QR ของ '+rec.chargerId+' ชี้ไปที่ข้อมูลล่าสุดแล้ว'}},
    ()=>({t:fmt(rec.date)}),

  const step=()=>{
    if(S.view!=='a-close'){while(c.done<T.length){c.res[c.done]=T[c.done]();c.done++}c.finished=true;return}

const stAddr=st=>st.own?stationOf(st.own).address:st.addr;
const extraOf=id=>(db.extra||[]).find(x=>x.id===id);
const ownerStatus=c=>c.station?memStatus():((db.customers.find(x=>x.id===c.cust)||{}).status||'Active');
function stOwnerStatus(st){return st.own?memStatus():(db.customers.find(c=>c.id===st.cust)||{}).status}
function consentOf(st){const s=st.own&&stationOf(st.own);return s?s.consent!==false:true}
function verifiedOf(st){
  if(!st.charger)return null;
  const rec=lastRec(st.charger);
  if(!rec||stOwnerStatus(st)!=='Active'||!consentOf(st))return null;
  return dayDiff(TODAY,rec.next)>0?rec:null;
}

  if(el.dataset.go){
    e.preventDefault();closeModal();
    const s=el.dataset.go,i=s.indexOf(':'),v=i<0?s:s.slice(0,i),p=i<0?null:s.slice(i+1);

  }
  const f=ACT[el.dataset.act];if(f)f(el,e);

  const t=e.target,d=t.dataset||{};
  if(d.roi){S.roi[d.roi]=parseFloat(t.value)||0;document.querySelectorAll('[data-lbl="'+d.roi+'"]').forEach(x=>x.textContent=S.roi[d.roi]);const o=$('#roi-out');if(o)o.innerHTML=roiOut();return}
  if(d.est){S.est[d.est]=Math.max(1,parseInt(t.value,10)||1);const o=$('#est-out');if(o)o.innerHTML=db.packages.map(k=>{const x=estimate(k,S.est.chargers,S.est.heads,S.est.yrs);return '<tr><td><b>'+k.name+'</b></td><td>'+MODEL[k.model]+'</td><td class="tn">'+baht(x.base)+'</td><td class="tn">'+(x.pct?'−'+x.pct+'%':'—')+'</td><td class="tn"><b>'+baht(x.total)+'</b></td><td>'+(x.over?pill('เกิน '+k.covers+' หัว','warn'):pill('ครอบคลุม','ok'))+'</td></tr>'}).join('');return}
  if(d.f){fieldChange(t);return}
  if(e.type!=='change')return;
  if(d.pk){const i=d.pk.indexOf('.'),id=d.pk.slice(0,i),path=d.pk.slice(i+1),p=pkgOf(id),isTxt=path==='model'||path==='terms';setPath(p,path,isTxt?t.value:(parseFloat(t.value)||0));toast('บันทึกแพ็กเกจ '+p.name+' แล้ว (ตัวอย่าง)','ok');return}
  if(d.chg&&CHG[d.chg])CHG[d.chg](t);
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
</script>
